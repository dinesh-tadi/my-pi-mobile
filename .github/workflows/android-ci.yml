name: Android CI & OTA Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-check:
    name: PR Lint & Version Bump Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Version & Build Code Increment
        run: |
          git fetch origin main --depth=10
          
          NEW_CODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | awk -F '=' '{print $2}' | tr -d ' ')
          NEW_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          
          BASE_CODE=$(git show origin/main:app/build.gradle.kts | grep "versionCode" | head -n 1 | awk -F '=' '{print $2}' | tr -d ' ')
          BASE_NAME=$(git show origin/main:app/build.gradle.kts | grep "versionName" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Base (main) Version: v${BASE_NAME} (Build ${BASE_CODE})"
          echo "🔍 PR (branch) Version: v${NEW_NAME} (Build ${NEW_CODE})"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          python3 -c "
          import sys

          def parse_semver(v):
              clean = v.strip().lstrip('v').split('-')[0]
              parts = [int(p) for p in clean.split('.')]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts)

          base_code = int('$BASE_CODE')
          new_code = int('$NEW_CODE')
          base_name = '$BASE_NAME'
          new_name = '$NEW_NAME'

          # 1. Exact Build Code Increment Check (+1)
          expected_code = base_code + 1
          if new_code != expected_code:
              print(f'❌ BLOCKED: versionCode must increment by exactly 1! Expected {expected_code}, found {new_code}.')
              sys.exit(1)

          # 2. Version Name Upgrade Check (at least a patch bump)
          base_v = parse_semver(base_name)
          new_v = parse_semver(new_name)
          if new_v <= base_v:
              print(f'❌ BLOCKED: versionName must be bumped! Base is {base_name}, found {new_name}.')
              sys.exit(1)

          print(f'✅ Version validation passed! v{base_name} (Build {base_code}) ➔ v{new_name} (Build {new_code})')
          "

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fast Compilation & Syntax Check
        run: |
          chmod +x gradlew
          echo "Running fast Kotlin syntax and type check..."
          ./gradlew compileDebugKotlin --stacktrace
          echo "✅ Compilation and syntax validation passed!"

  release:
    name: Build APK & OTA Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore from Secrets
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/argon.keystore
          echo "✅ Keystore restored from GitHub Secrets"
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Extract App Version Information
        id: app_version
        run: |
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | awk -F '=' '{print $2}' | tr -d ' ')
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=v${VERSION_NAME}-b${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: argon-hub-v${{ steps.app_version.outputs.VERSION_NAME }}-b${{ steps.app_version.outputs.VERSION_CODE }}.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.app_version.outputs.TAG_NAME }}
          name: Argon Mobile Hub ${{ steps.app_version.outputs.TAG_NAME }}
          body: |
            Automated CI/CD build from commit `${{ github.sha }}`.
            
            - **Version Name:** ${{ steps.app_version.outputs.VERSION_NAME }}
            - **Version Code:** ${{ steps.app_version.outputs.VERSION_CODE }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale (OTA Pi Deploy)
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        env:
          HAS_TAILSCALE: ${{ secrets.TAILSCALE_AUTHKEY != '' }}

      - name: Deploy APK to Raspberry Pi OTA Server
        if: env.HAS_TAILSCALE == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          PI_DEST="${{ secrets.PI_USER || 'argon' }}@${{ secrets.PI_HOST || '100.123.87.122' }}"
          ssh -o StrictHostKeyChecking=no "$PI_DEST" "mkdir -p ~/my-pi/argon-ota/dist"
          
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > version.json
          {
            "versionCode": ${{ steps.app_version.outputs.VERSION_CODE }},
            "versionName": "${{ steps.app_version.outputs.VERSION_NAME }}",
            "releaseDate": "${NOW}",
            "apkPath": "/argon-hub.apk",
            "releaseNotes": "Automated OTA update from commit ${{ github.sha }}"
          }
          EOF
          
          scp -o StrictHostKeyChecking=no version.json "$PI_DEST:~/my-pi/argon-ota/dist/version.json"
          scp -o StrictHostKeyChecking=no app/build/outputs/apk/debug/app-debug.apk "$PI_DEST:~/my-pi/argon-ota/dist/argon-hub.apk"
          echo "🎉 Successfully published OTA update to Raspberry Pi!"

          # Send Telegram notification from Pi
          ssh -o StrictHostKeyChecking=no "$PI_DEST" "
            if [ -f ~/my-pi/stock-watcher/.env ]; then
              BOT_TOKEN=\$(grep -E '^TELEGRAM_BOT_TOKEN=' ~/my-pi/stock-watcher/.env | cut -d '=' -f2- | tr -d ' \"')
              CHAT_ID=\$(grep -E '^TELEGRAM_CHAT_ID=' ~/my-pi/stock-watcher/.env | cut -d '=' -f2- | tr -d ' \"')
              if [ -n \"\$BOT_TOKEN\" ] && [ -n \"\$CHAT_ID\" ]; then
                MSG=\"📱 <b>Argon Mobile Hub OTA Released!</b>%0A• <b>Version:</b> v${{ steps.app_version.outputs.VERSION_NAME }} (Build ${{ steps.app_version.outputs.VERSION_CODE }})%0A• <b>Release Tag:</b> ${{ steps.app_version.outputs.TAG_NAME }}%0A• <b>OTA Endpoint:</b> http://argon-host:5050%0A• <b>Time:</b> \$(date '+%Y-%m-%d %H:%M:%S')\"
                curl -s -X POST \"https://api.telegram.org/bot\${BOT_TOKEN}/sendMessage\" -d chat_id=\"\${CHAT_ID}\" -d parse_mode=\"HTML\" -d text=\"\${MSG}\" >/dev/null 2>&1 || true
                echo '✅ Telegram notification sent.'
              fi
            fi
          "
        env:
          HAS_TAILSCALE: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
